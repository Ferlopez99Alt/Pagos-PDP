<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagos PDP - Registro de Residente</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="icon" type="image/png" href="img/icon.png">
</head>
<body>

    <header class="navbar">
        <div class="navbar-icon"><img src="img/logo.png" alt="Pagos PDP" style="height: 50px;"></div>
        <div class="navbar-title">
            <h1>Pagos PDP</h1>
            <p>Sistema de cobros</p>
        </div>
    </header>

    <main class="main-container">
        <section class="auth-card">
            <h2>Crear cuenta</h2>
            <p>Registro de nuevo residente</p>

            <form id="form-register">
                <div class="role-selector" style="margin-bottom: 0;">
                    <div class="form-group">
                        <label for="reg-nombre" class="form-label">Nombre</label>
                        <input type="text" id="reg-nombre" class="form-input" placeholder="Juan" required>
                    </div>
                    <div class="form-group">
                        <label for="reg-apellido" class="form-label">Apellido</label>
                        <input type="text" id="reg-apellido" class="form-input" placeholder="Pérez" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="reg-casa" class="form-label">Número de casa</label>
                    <input type="text" id="reg-casa" class="form-input" placeholder="Ej. 123" required>
                    <span class="input-help">Debe corresponder a una vivienda válida del sistema</span>
                </div>

                <div class="form-group">
                    <label for="reg-correo" class="form-label">Correo electrónico</label>
                    <input type="email" id="reg-correo" class="form-input" placeholder="usuario@correo.com" required>
                </div>

                <div class="form-group">
                    <label for="reg-password" class="form-label">Contraseña</label>
                    <input type="password" id="reg-password" class="form-input" placeholder="••••••" required minlength="6">
                </div>

                <div class="form-group" style="margin-bottom: 25px;">
                    <label for="reg-confirm-password" class="form-label">Confirmar contraseña</label>
                    <input type="password" id="reg-confirm-password" class="form-input" placeholder="••••••" required>
                </div>

                <button type="submit" class="btn-submit">Registrarme</button>
            </form>

            <p class="text-center" style="margin-top: 20px; font-size: 0.85rem; color: #555;">
                ¿Ya tienes una cuenta? <a href="index.html" class="text-link" style="color: var(--terracota); font-weight: 600; text-decoration: none;">Iniciar sesión</a>
            </p>
        </section>
    </main>

    <script src="js/database.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
